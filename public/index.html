<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>鳍点AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginView" class="login-view hidden">
    <div class="login-card">
      <svg class="shark-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="鳍点AI">
        <path d="M24 5 C26 15, 30 23, 38 30 C32 34, 27 37, 24 43 C21 37, 16 34, 10 30 C18 23, 22 15, 24 5 Z"/>
        <path d="M6 43 C14 40, 32 40, 42 43"/>
      </svg>
      <h1>鳍点AI</h1>
      <p class="login-tip">输入电脑上显示的访问密码</p>
      <input id="passwordInput" type="password" placeholder="访问密码" autocomplete="current-password">
      <button id="loginBtn" class="btn primary">进入</button>
      <p id="loginError" class="error hidden">密码错误</p>
    </div>
  </div>

  <div id="mainView" class="main-view hidden">
    <div class="app-header">
      <div class="app-brand">
        <svg class="shark-mark small" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="鳍点AI">
          <path d="M24 5 C26 15, 30 23, 38 30 C32 34, 27 37, 24 43 C21 37, 16 34, 10 30 C18 23, 22 15, 24 5 Z"/>
          <path d="M6 43 C14 40, 32 40, 42 43"/>
        </svg>
        鳍点AI
      </div>
      <div class="app-actions">
        <button id="refreshBtn" class="icon-btn" title="刷新">⟳</button>
        <button id="settingsBtn" class="icon-btn" title="设置">⚙</button>
      </div>
    </div>
    <div class="main-body">
    <div id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <button id="newChatBtn" class="btn primary small">＋ 新对话</button>
        <button id="claimBtn" class="btn ghost small" title="把升级前的旧对话归到本设备">认领旧对话</button>
        <button id="closeSidebarBtn" class="btn ghost small">收起</button>
      </div>
      <div id="threadList" class="thread-list"></div>
      <div class="sidebar-foot">
        <div class="quick-config">
          <input id="shareKeyInput" type="text" placeholder="一键配置密钥">
          <button id="shareKeyBtn" class="btn primary small">一键配置</button>
        </div>
        <div id="statusLine" class="status-line">连接中…</div>
        <div id="metaLine" class="meta-line"></div>
      </div>
    </div>

    <div class="chat">
      <div class="chat-head">
        <button id="menuBtn" class="btn ghost small">☰</button>
        <div class="chat-title" id="chatTitle">新对话</div>
        <span id="connBadge" class="conn-badge"></span>
        <span id="connLabel" class="conn-label">连接中</span>
        <button id="reconnectBtn" class="btn ghost small hidden">重连</button>
        <button id="interruptBtn" class="btn warn small hidden">停止</button>
      </div>
      <div id="messages" class="messages"></div>
      <div id="eventTrace" class="event-trace hidden"></div>
      <div id="approvalArea" class="approval-area"></div>
      <div id="quoteBar" class="quote-bar hidden">
        <span id="quoteAuthor" class="quote-author"></span>
        <span id="quoteText" class="quote-text"></span>
        <button id="quoteCancel" class="icon-btn" title="取消引用">×</button>
      </div>
      <div class="composer">
        <div id="imagePreviews" class="image-previews"></div>
        <div class="composer-row">
          <div class="attach-wrap">
            <button type="button" class="attach-btn" id="attachBtn" title="添加图片或文件">＋</button>
            <div class="attach-menu hidden" id="attachMenu">
              <button type="button" data-pick="image">🖼 添加图片</button>
              <button type="button" data-pick="file">📄 添加文件</button>
            </div>
          </div>
          <input id="imageInput" type="file" accept="image/*" multiple hidden>
          <input id="fileInput" type="file" accept=".txt,.md,.markdown,.json,.csv,.tsv,.log,.xml,.yaml,.yml,.ini,.conf,.cfg,.js,.mjs,.cjs,.ts,.jsx,.tsx,.py,.rb,.go,.rs,.java,.c,.h,.cpp,.hpp,.cs,.php,.html,.htm,.css,.scss,.sql,.sh,.bat,.cmd,.ps1,.toml,.properties,.xlsx,.xlsm,.xls,.docx,.doc,.pptx,.ppt,.pdf" multiple hidden>
          <textarea id="inputBox" rows="1" placeholder="给鳍点AI发消息…"></textarea>
          <button id="sendBtn" class="btn primary small">发送</button>
        </div>
      </div>
    </div>
    </div>
  </div>

  <script src="relay.js"></script>
  <script src="app.js"></script>
</body>
</html>
